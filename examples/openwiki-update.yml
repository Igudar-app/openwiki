name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC; 08:00 UTC is midnight PST.
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Run OpenWiki
        # The image from GHCR is public and includes openwiki + mermaid + jsdom,
        # so no package registry auth is needed. Pin to the exact version.
        run: |
          docker run --rm \
            -e OPENWIKI_PROVIDER=deepseek \
            -e DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            -e OPENWIKI_MODEL_ID=deepseek-v4-flash \
            -e OPENWIKI_LANGSMITH_API_KEY="${{ secrets.OPENWIKI_LANGSMITH_API_KEY }}" \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/igudar-app/openwiki:0.4.2 code --update --print

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
